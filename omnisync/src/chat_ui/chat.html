<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSync</title>
    <link rel="stylesheet" href="./chat.css">
</head>

<body>
    <div class="banner">
        <h1>OmniSync</h1>
    </div>
    <div class="container-box">

        <div class="left-nav">

            <div class="rooms">

                <h4>Rooms</h4>
                <div class="create-room">
                    <button>+ Create Room</button>
                </div>

                <div class="list-of-rooms">
                    <ul>
                        <li># General</li>
                        <li># Gaming</li>
                        <li># Java</li>
                        <li># Misc</li>
                    </ul>
                </div>
                
            </div>

        </div>


        <div class="right-nav">

            <div class="chats">
                <p>chats</p>
            </div>
            <div class="send-text">
                <input type="text" placeholder="Type a message...">
                <button type="submit">[Send]</button>
            </div>
        </div>
    </div>
</body>

</html>
